<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<p>Open this file in a browser, right-click each canvas, and "Save image as" to create the PNG icons.</p>
<div id="canvases"></div>
<script>
const sizes = [16, 48, 128];

sizes.forEach(size => {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  // Background
  const grad = ctx.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, '#1a2a3a');
  grad.addColorStop(1, '#0d1b2a');
  ctx.fillStyle = grad;
  roundRect(ctx, 0, 0, size, size, size * 0.18);
  ctx.fill();

  // Server icon
  const pad = size * 0.2;
  const boxH = size * 0.22;
  const gap = size * 0.06;

  ctx.strokeStyle = '#4fc3f7';
  ctx.lineWidth = Math.max(1, size * 0.06);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Top server box
  const y1 = pad;
  roundRect(ctx, pad, y1, size - pad * 2, boxH, size * 0.06);
  ctx.stroke();

  // Dot on top box
  ctx.beginPath();
  ctx.arc(pad + size * 0.1, y1 + boxH / 2, size * 0.04, 0, Math.PI * 2);
  ctx.fillStyle = '#4fc3f7';
  ctx.fill();

  // Bottom server box
  const y2 = y1 + boxH + gap;
  roundRect(ctx, pad, y2, size - pad * 2, boxH, size * 0.06);
  ctx.stroke();

  // Dot on bottom box
  ctx.beginPath();
  ctx.arc(pad + size * 0.1, y2 + boxH / 2, size * 0.04, 0, Math.PI * 2);
  ctx.fill();

  // Label
  const label = document.createElement('p');
  label.textContent = `icon${size}.png`;
  document.getElementById('canvases').appendChild(label);
  document.getElementById('canvases').appendChild(canvas);
});

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}
</script>
</body>
</html>
