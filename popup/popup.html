<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Summary Bot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-title">
        <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
          <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
          <line x1="6" y1="6" x2="6.01" y2="6"></line>
          <line x1="6" y1="18" x2="6.01" y2="18"></line>
        </svg>
        <h1>Server Summary</h1>
      </div>
      <button id="settingsBtn" class="icon-btn" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.32 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>

    <!-- Import from Page -->
    <div class="import-section">
      <button id="importPageBtn" class="import-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        Import from Current Page
      </button>
      <p class="import-hint">Open your INTEGRIS Machine Stats page, then click above to import</p>
    </div>

    <!-- Search Bar -->
    <div class="search-section">
      <div class="search-bar">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="machineSearch" placeholder="Search by Machine Name..." autocomplete="off">
        <button id="searchBtn" class="search-btn">Search</button>
      </div>
      <div id="suggestions" class="suggestions hidden"></div>
    </div>

    <!-- Status Bar -->
    <div id="statusBar" class="status-bar hidden">
      <span id="statusText"></span>
    </div>

    <!-- Server Info Panel -->
    <div id="serverPanel" class="server-panel hidden">
      <!-- OS Section -->
      <div class="section">
        <div class="section-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect>
            <rect x="9" y="9" width="6" height="6"></rect>
            <line x1="9" y1="1" x2="9" y2="4"></line>
            <line x1="15" y1="1" x2="15" y2="4"></line>
            <line x1="9" y1="20" x2="9" y2="23"></line>
            <line x1="15" y1="20" x2="15" y2="23"></line>
            <line x1="20" y1="9" x2="23" y2="9"></line>
            <line x1="20" y1="14" x2="23" y2="14"></line>
            <line x1="1" y1="9" x2="4" y2="9"></line>
            <line x1="1" y1="14" x2="4" y2="14"></line>
          </svg>
          <h2>System Information</h2>
        </div>
        <div class="field-grid">
          <div class="field">
            <label>Machine Name</label>
            <span id="fieldMachineName" class="value">--</span>
          </div>
          <div class="field">
            <label>OS Type</label>
            <span id="fieldOsType" class="value">
              <span id="osTypeIcon" class="os-icon"></span>
              <span id="osTypeText">--</span>
            </span>
          </div>
          <div class="field full-width">
            <label>Operating System</label>
            <span id="fieldOs" class="value">--</span>
          </div>
          <div class="field">
            <label>Model</label>
            <span id="fieldModel" class="value">--</span>
          </div>
          <div class="field">
            <label>Location</label>
            <span id="fieldLocation" class="value">--</span>
          </div>
        </div>
      </div>

      <!-- Active Directory Section -->
      <div class="section">
        <div class="section-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <h2>Active Directory</h2>
        </div>
        <div class="field-grid">
          <div class="field">
            <label>AD Created</label>
            <span id="fieldAdCreated" class="value">--</span>
          </div>
          <div class="field">
            <label>Last AD Update</label>
            <span id="fieldLastAdUpdate" class="value">--</span>
          </div>
        </div>
      </div>

      <!-- Check-in & Updates Section -->
      <div class="section">
        <div class="section-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
          <h2>Check-in &amp; Updates</h2>
        </div>
        <div class="field-grid">
          <div class="field">
            <label>Last Check-in</label>
            <span id="fieldLastCheckin" class="value">--</span>
          </div>
          <div class="field">
            <label>Last McAfee Update</label>
            <span id="fieldLastMcafee" class="value">--</span>
          </div>
          <div class="field">
            <label>Last SCCM Update</label>
            <span id="fieldLastSccm" class="value">--</span>
          </div>
          <div class="field">
            <label>Last OneSign Update</label>
            <span id="fieldLastOnesign" class="value">--</span>
          </div>
        </div>
      </div>

      <!-- Actions Section -->
      <div class="section actions-section">
        <div class="field full-width">
          <label>Reports Direct URL</label>
          <a id="fieldReportsUrl" class="value link" href="#" target="_blank">--</a>
        </div>
        <div class="action-buttons">
          <button id="exportCsvBtn" class="action-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Export Report to CSV
          </button>
          <button id="refreshBtn" class="action-btn secondary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
            Refresh Data
          </button>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
        <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
        <line x1="6" y1="6" x2="6.01" y2="6"></line>
        <line x1="6" y1="18" x2="6.01" y2="18"></line>
      </svg>
      <p>Open your machine stats portal, then click<br><strong>"Import from Current Page"</strong> above</p>
    </div>

    <!-- Loading State -->
    <div id="loadingState" class="loading-state hidden">
      <div class="spinner"></div>
      <p>Fetching server data...</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
